name: Build Signal Desk intelligence snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2,8,14 * * *'

permissions:
  contents: write

concurrency:
  group: signal-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Load previous public snapshot
        shell: bash
        run: |
          git fetch origin signal-data:refs/remotes/origin/signal-data || true
          git show origin/signal-data:snapshot.json > "$RUNNER_TEMP/previous.json" || true
      - name: Collect public evidence
        shell: bash
        run: |
          if [ "$(date -u +%u)" = 1 ]; then weekly=--weekly-docs; else weekly=; fi
          python3 scripts/collect-intelligence.py --previous "$RUNNER_TEMP/previous.json" --output "$RUNNER_TEMP/snapshot.json" $weekly
          python3 -m json.tool "$RUNNER_TEMP/snapshot.json" > /dev/null
      - name: Publish snapshot to isolated data branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/data-branch"
          cd "$RUNNER_TEMP/data-branch"
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch origin signal-data || true
          if git rev-parse FETCH_HEAD >/dev/null 2>&1; then git checkout -B signal-data FETCH_HEAD; else git checkout --orphan signal-data; fi
          cp "$RUNNER_TEMP/snapshot.json" snapshot.json
          git add snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: refresh public intelligence snapshot'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:signal-data
